spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:leetcodedaily;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

logging:
  level:
    com.leetcodedaily: DEBUG
    org.springframework.security: INFO
