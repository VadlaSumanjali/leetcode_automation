spring:
  application:
    name: leetcode-daily-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:leetcode_daily}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:leetcode_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:leetcode_secret}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: LeetCodeDailyHikariPool
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# App specific properties
app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlX2xlZXRjb2RlX2RhaWx5X2p3dF9zZWNyZXRfa2V5XzIwMjZfcHJvZHVjdGlvbg==}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
  scheduler:
    daily-cron: ${DAILY_EMAIL_CRON:0 0 6 * * *}
  cors:
    allowed-origins: ${CLIENT_ORIGIN:http://localhost:5173}

